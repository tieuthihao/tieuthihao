<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B1 TELC – Bộ Đề Ả Rập</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #22222d;
    --border: #2e2e3e;
    --accent: #c8a96e;
    --accent2: #7eb8c8;
    --green: #6ec89a;
    --text: #e8e8f0;
    --muted: #888899;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

  /* SIDEBAR */
  #sidebar {
    width: 280px; min-height: 100vh; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 10;
  }
  .sidebar-header { padding: 28px 20px 20px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--accent); line-height: 1.2; }
  .sidebar-header p { font-size: 0.75rem; color: var(--muted); margin-top: 6px; letter-spacing: 0.05em; text-transform: uppercase; }
  .section-label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 18px 20px 8px; font-weight: 600; }
  .bode-btn {
    display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    cursor: pointer; border: none; background: none; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 0.875rem; text-align: left;
    width: 100%; border-left: 3px solid transparent; transition: all 0.18s ease;
  }
  .bode-btn:hover { background: var(--surface2); border-left-color: var(--accent); }
  .bode-btn.active { background: var(--surface2); border-left-color: var(--accent); color: var(--accent); font-weight: 600; }
  .bode-btn .num { font-size: 0.7rem; background: var(--surface2); color: var(--muted); padding: 2px 7px; border-radius: 20px; min-width: 28px; text-align: center; }
  .bode-btn.active .num { background: var(--accent); color: #000; }

  /* API KEY BAR */
  #apibar {
    padding: 12px 16px; background: rgba(200,169,110,0.07);
    border-top: 1px solid var(--border); margin-top: auto;
  }
  #apibar label { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
  #apibar .api-row { display: flex; gap: 6px; }
  #apikey-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 7px 10px; border-radius: 8px;
    font-size: 0.78rem; font-family: monospace; outline: none;
  }
  #apikey-input:focus { border-color: var(--accent); }
  #apikey-save {
    background: var(--accent); color: #000; border: none; border-radius: 8px;
    padding: 7px 12px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }
  #apikey-status { font-size: 0.72rem; margin-top: 5px; color: var(--muted); }
  #apikey-status.ok { color: var(--green); }

  /* MAIN */
  #main { margin-left: 280px; flex: 1; padding: 40px 48px; max-width: 920px; }

  #welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; gap: 16px; }
  #welcome .big-title { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--accent); line-height: 1.1; }
  #welcome p { color: var(--muted); font-size: 1rem; max-width: 420px; line-height: 1.7; }
  #welcome .arrow { font-size: 2rem; color: var(--border); animation: bounce 1.5s infinite; }
  @keyframes bounce { 0%,100% { transform: translateX(-8px); } 50% { transform: translateX(0); } }

  #content { display: none; }
  .content-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 32px; gap: 16px; }
  .content-title h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--accent); }
  .content-title p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .btn-translate {
    display: flex; align-items: center; gap: 8px; padding: 10px 20px;
    background: linear-gradient(135deg, var(--accent2), #5a9ab0);
    color: #fff; border: none; border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s; white-space: nowrap; flex-shrink: 0;
  }
  .btn-translate:hover { opacity: 0.85; }
  .btn-translate:disabled { opacity: 0.5; cursor: not-allowed; }

  .tab-bar { display: flex; gap: 4px; margin-bottom: 28px; background: var(--surface); padding: 4px; border-radius: var(--radius); width: fit-content; }
  .tab-btn { padding: 8px 18px; border: none; background: none; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 0.875rem; border-radius: 8px; cursor: pointer; transition: all 0.18s; font-weight: 500; }
  .tab-btn.active { background: var(--surface2); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }

  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .options-grid h3 { grid-column: 1/-1; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .option-chip { display: flex; align-items: flex-start; gap: 8px; font-size: 0.82rem; line-height: 1.4; color: var(--text); }
  .option-chip .letter { background: var(--surface2); color: var(--accent); font-weight: 700; font-size: 0.75rem; padding: 2px 7px; border-radius: 6px; flex-shrink: 0; margin-top: 1px; }

  .question-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; transition: border-color 0.2s; }
  .question-card:hover { border-color: var(--accent); }
  .question-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .q-number { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .q-points { font-size: 0.7rem; background: var(--surface2); color: var(--accent); padding: 2px 8px; border-radius: 20px; }
  .question-text { font-size: 0.9rem; line-height: 1.75; color: #ccc; margin-bottom: 16px; font-style: italic; border-left: 3px solid var(--border); padding-left: 14px; }
  .question-text.vi { color: var(--accent2); border-left-color: var(--accent2); font-style: normal; margin-top: 10px; }
  .answer-reveal { display: flex; align-items: center; gap: 10px; background: rgba(110,200,154,0.08); border: 1px solid rgba(110,200,154,0.25); border-radius: 8px; padding: 10px 14px; font-size: 0.875rem; }
  .answer-reveal .ans-letter { background: var(--green); color: #000; font-weight: 700; padding: 2px 10px; border-radius: 6px; font-size: 0.85rem; }
  .answer-reveal .ans-text { color: var(--green); font-weight: 500; }

  .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent2); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  #menu-toggle { display: none; position: fixed; top: 12px; left: 12px; z-index: 100; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 1rem; }

  @media (max-width: 768px) {
    #menu-toggle { display: block; }
    #sidebar { transform: translateX(-100%); transition: transform 0.25s; }
    #sidebar.open { transform: translateX(0); }
    #main { margin-left: 0; padding: 24px 20px; padding-top: 60px; }
    .options-grid { grid-template-columns: 1fr; }
    .content-header { flex-direction: column; }
    #welcome .big-title { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<button id="menu-toggle" onclick="toggleSidebar()">☰</button>

<nav id="sidebar">
  <div class="sidebar-header">
    <h1>B1 TELC<br>Bộ Đề Ả Rập</h1>
    <p>Luyện thi · Có đáp án</p>
  </div>
  <div class="section-label">Leseverstehen + Sprachbausteine</div>
  <div id="bode-list"></div>
  <div style="flex:1"></div>

  <!-- API KEY -->
  <div id="apibar">
    <label>🔑 Claude API Key (để dịch tiếng Việt)</label>
    <div class="api-row">
      <input id="apikey-input" type="password" placeholder="sk-ant-..." spellcheck="false">
      <button id="apikey-save" onclick="saveApiKey()">Lưu</button>
    </div>
    <div id="apikey-status"></div>
  </div>
</nav>

<main id="main">
  <div id="welcome">
    <div class="arrow">←</div>
    <div class="big-title">Chọn<br>bộ đề</div>
    <p>Chọn một bộ đề từ danh sách bên trái. Nhập Claude API key để bật tính năng dịch tiếng Việt tự động.</p>
  </div>

  <div id="content">
    <div class="content-header">
      <div class="content-title">
        <h2 id="content-title-text"></h2>
        <p id="content-subtitle"></p>
      </div>
      <button class="btn-translate" id="btn-translate" onclick="translateCurrent()">🌐 Dịch tiếng Việt</button>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('lese')">📖 Leseverstehen</button>
      <button class="tab-btn" onclick="switchTab('sprach')">✏️ Sprachbausteine</button>
    </div>
    <div id="lese-panel"></div>
    <div id="sprach-panel" style="display:none"></div>
  </div>
</main>

<script>
// ═══════════════════════════════════════════
// DỮ LIỆU BỘ ĐỀ
// Thêm bộ đề mới vào mảng BODE bên dưới
// ═══════════════════════════════════════════
const BODE = [
  {
    id: "petra",
    name: "PETRA",
    lese: {
      teil: "Teil 1",
      options: [
        { l: "A", text: "Angebot für Reisende: Für wenig Geld öffentliche Verkehrsmittel benutzen" },
        { l: "B", text: "Bildband: Babys im Garten" },
        { l: "C", text: "Ein Schüler mit vielen Ideen" },
        { l: "D", text: "Früh übt sich: Hotels bieten Skikurse für Zweijährige an" },
        { l: "E", text: "Handbuch für Hobby-Fotografen" },
        { l: "F", text: "Neu: Mit dem Taxi gratis zur Disco" },
        { l: "G", text: "Neu: Taxi – Tickets für Discobesucher" },
        { l: "H", text: "Schulkinder schreiben spannende Geschichten" },
        { l: "I", text: "Skikurs für Eltern und Kinder" },
        { l: "J", text: "Straßenbahn und Bus im Flugticket enthalten" },
      ],
      questions: [
        { n:1, text: "Ich möchte, dass Menschen, die meine Fotos gesehen haben, von nun an die Welt mit anderen Augen betrachten. Das könnte der neuseeländischen Fotografin Anne Geddes gelingen. Denn die Bilder, die sie für das Buch „Drunten im Garten" von den kleinen Menschenkindern gemacht hat, sind ungewöhnlich und wunderschön: Babys auf Blumen, Blättern, Beeren, verkleidet als Morcheln, Melonen oder Marienkäfer, Babys in Tulpen und als Schmetterlinge. Ein Bildband, angereichert mit poetischen Texten und Ratschlägen.", answer:"B" },
        { n:2, text: "Die meisten Skikurse für Kinder beginnen im Alter von vier Jahren. Im Kärntner Baby Dorf Trebesing ist das anders: Hier werden im „Windel-Wedel-Camp" bereits Kleinkinder ab zwei Jahren unterrichtet. Täglich zwei Stunden können die Skihasen unter fachkundiger Anleitung auf einem flachen Hügel erste Geh- bzw. Fahrversuche auf zwei Brettern machen. Nach einigen Tagen Übung geht es dann mit dem Baby-Bus ins Skigebiet Innerkrems.", answer:"D" },
        { n:3, text: "Berlins jüngster Schriftsteller hat deutlich mehr Texte verfasst als er Jahre zählt. Rund 50 Gedichte und Erzählungen tippte Daniel Story, 12, schon in seinen Computer. „Ich schreibe fast, seitdem es mich gibt", sagt der Sechstklässler. Bereits mit sieben dichtete er die ersten Verse, jetzt mit zwölf ist er stolz auf seine erste Autorenlesung.", answer:"C" },
        { n:4, text: "Ob Sie privat oder geschäftlich unterwegs sind, mit dem Stadt-Ticket können Sie billig die öffentlichen Verkehrsmittel nutzen. Voraussetzung: Sie sind mit dem Flugzeug oder der Deutschen Bahn (über 100 km) angereist. Gegen einen Aufpreis von nur Euro 2,50 ermöglicht Ihnen das Stadt-Ticket auch nach der Ankunft am Zielort freie Fahrt. Mit U-, S- oder Straßenbahnen sowie Bussen. Bis zu 48 Stunden.", answer:"A" },
        { n:5, text: "In Mecklenburg-Vorpommern können junge Leute jetzt für den halben Fahrpreis mit dem Taxi auf Discotour gehen. Tickets dafür sind bei allen Geschäftsstellen der AOK sowie an Esso-Tankstellen zum halben Preis erhältlich. Junge Leute zwischen 16 und 25 Jahren können sie an Wochenenden und Feiertagen in der Zeit von 20 Uhr bis morgens 6 Uhr benutzen.", answer:"G" },
      ]
    },
    sprach: null
  },
  // Thêm bộ đề mới ở đây...
];

const COMING_SOON = [
  "EVA","SOPHIE","NADJA / CLAUDIA","NICOLE","ANDREAS","ANDREAS 2",
  "ANNIKA 1","ANNIKA 2","IRIS","CAROLINE","VERA","JENNIFER",
  "THOMAS / ANNA","TAMARA / JAKOB","JAN","VIKTOR","SONJA",
  "ALEX & CORA","CORINA","PAUL","RITA","MIROSLAV","KARLA","MORITZ","ALICIA","MARA"
];

// ── STATE ──
let currentBode = null;
let currentTab = 'lese';
let translationCache = {};

// ── API KEY ──
function loadApiKey() {
  const k = localStorage.getItem('telc_api_key') || '';
  if (k) {
    document.getElementById('apikey-input').value = k;
    document.getElementById('apikey-status').textContent = '✓ Đã lưu key';
    document.getElementById('apikey-status').className = 'ok';
  }
}

function saveApiKey() {
  const k = document.getElementById('apikey-input').value.trim();
  if (!k) return;
  localStorage.setItem('telc_api_key', k);
  document.getElementById('apikey-status').textContent = '✓ Đã lưu!';
  document.getElementById('apikey-status').className = 'ok';
}

function getApiKey() {
  return localStorage.getItem('telc_api_key') || '';
}

// ── SIDEBAR ──
function buildSidebar() {
  const list = document.getElementById('bode-list');
  list.innerHTML = '';
  BODE.forEach((b, i) => {
    const btn = document.createElement('button');
    btn.className = 'bode-btn';
    btn.id = 'btn-' + b.id;
    btn.innerHTML = `<span class="num">${i+1}</span> ${b.name}`;
    btn.onclick = () => loadBode(b.id);
    list.appendChild(btn);
  });
  if (COMING_SOON.length) {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.style.color = '#3a3a4a';
    lbl.textContent = `Sắp có (${COMING_SOON.length} bộ đề)`;
    list.appendChild(lbl);
    COMING_SOON.forEach((name, i) => {
      const btn = document.createElement('button');
      btn.className = 'bode-btn';
      btn.style.opacity = '0.3';
      btn.style.cursor = 'default';
      btn.innerHTML = `<span class="num">${BODE.length+i+1}</span> ${name}`;
      list.appendChild(btn);
    });
  }
}

// ── LOAD ──
function loadBode(id) {
  currentBode = BODE.find(b => b.id === id);
  if (!currentBode) return;
  document.querySelectorAll('.bode-btn').forEach(b => b.classList.remove('active'));
  const ab = document.getElementById('btn-' + id);
  if (ab) ab.classList.add('active');
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  document.getElementById('content-title-text').textContent = currentBode.name;
  document.getElementById('content-subtitle').textContent = 'Leseverstehen + Sprachbausteine · Có đáp án';
  const btn = document.getElementById('btn-translate');
  btn.disabled = false;
  btn.innerHTML = '🌐 Dịch tiếng Việt';
  translationCache = {};
  switchTab('lese');
  if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
}

// ── TABS ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i===0 && tab==='lese') || (i===1 && tab==='sprach'));
  });
  document.getElementById('lese-panel').style.display = tab==='lese' ? 'block' : 'none';
  document.getElementById('sprach-panel').style.display = tab==='sprach' ? 'block' : 'none';
  renderCurrentTab();
}

function renderCurrentTab() {
  if (!currentBode) return;
  if (currentTab === 'lese') renderLese();
  else renderSprach();
}

function renderLese() {
  const panel = document.getElementById('lese-panel');
  const data = currentBode.lese;
  if (!data) { panel.innerHTML = '<div class="empty-state"><div class="icon">📄</div>Chưa có dữ liệu</div>'; return; }
  const trans = translationCache[currentBode.id + '_lese'];
  let html = '';

  // Options
  html += '<div class="options-grid"><h3>Đáp án lựa chọn – ' + data.teil + '</h3>';
  data.options.forEach((opt, i) => {
    const vi = trans && trans.options && trans.options[i] ? `<br><span style="color:var(--accent2);font-size:0.78rem">→ ${trans.options[i]}</span>` : '';
    html += `<div class="option-chip"><span class="letter">${opt.l}</span><span>${opt.text}${vi}</span></div>`;
  });
  html += '</div>';

  // Questions
  data.questions.forEach((q, i) => {
    const vi = trans && trans.questions && trans.questions[i];
    const ansOpt = data.options.find(o => o.l === q.answer);
    html += `<div class="question-card">
      <div class="question-meta"><span class="q-number">Aufgabe ${q.n}</span><span class="q-points">5 Punkte</span></div>
      <div class="question-text">${q.text}</div>
      ${vi ? `<div class="question-text vi">${vi}</div>` : ''}
      <div class="answer-reveal"><span class="ans-letter">${q.answer}</span><span class="ans-text">${ansOpt ? ansOpt.text : ''}</span></div>
    </div>`;
  });

  panel.innerHTML = html;
}

function renderSprach() {
  const panel = document.getElementById('sprach-panel');
  const data = currentBode.sprach;
  if (!data) {
    panel.innerHTML = `<div class="empty-state"><div class="icon">📋</div><div>Chưa có dữ liệu Sprachbausteine</div><div style="font-size:0.8rem;margin-top:6px">Paste nội dung Teil 2 vào code để hiển thị</div></div>`;
    return;
  }
  // Render tương tự lese nếu có data
  panel.innerHTML = '<p style="color:var(--muted)">Dữ liệu Sprachbausteine sẽ hiển thị ở đây.</p>';
}

// ── DỊCH ──
async function translateCurrent() {
  if (!currentBode) return;
  const apiKey = getApiKey();
  if (!apiKey) {
    alert('Vui lòng nhập Claude API key ở góc dưới bên trái sidebar trước!');
    return;
  }

  const cacheKey = currentBode.id + '_' + currentTab;
  if (translationCache[cacheKey]) {
    delete translationCache[cacheKey];
    document.getElementById('btn-translate').innerHTML = '🌐 Dịch tiếng Việt';
    renderCurrentTab();
    return;
  }

  const data = currentTab === 'lese' ? currentBode.lese : currentBode.sprach;
  if (!data) return;

  const btn = document.getElementById('btn-translate');
  btn.disabled = true;
  btn.innerHTML = '<span style="display:flex;align-items:center;gap:6px"><span class="spinner"></span> Đang dịch...</span>';

  const optionsText = data.options.map((o,i) => `[${i}] ${o.l}) ${o.text}`).join('\n');
  const questionsText = data.questions.map((q,i) => `[${i}] ${q.text}`).join('\n\n');

  const prompt = `Dịch các đoạn văn tiếng Đức sau sang tiếng Việt tự nhiên, ngắn gọn, chính xác. Chỉ trả về JSON, không giải thích.

CÁC ĐÁP ÁN:
${optionsText}

CÁC ĐOẠN VĂN:
${questionsText}

Trả về đúng format:
{"options":["dịch 0","dịch 1",...],"questions":["dịch 0","dịch 1",...]}`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1500,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const result = await res.json();
    if (result.error) throw new Error(result.error.message);
    const raw = result.content.map(c => c.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    translationCache[cacheKey] = JSON.parse(clean);
    btn.innerHTML = '🔄 Về tiếng Đức';
    btn.disabled = false;
    renderCurrentTab();
  } catch(e) {
    btn.innerHTML = '❌ Lỗi – thử lại';
    btn.disabled = false;
    alert('Lỗi: ' + e.message);
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// INIT
buildSidebar();
loadApiKey();
</script>
</body>
</html>
